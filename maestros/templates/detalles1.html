{% extends "layout.html" %}

{% block container %}
<div class="flex justify-center items-center min-h-[70vh]">

    <div class="bg-white block max-w-sm w-full border border-gray-200 rounded-2xl shadow-xl overflow-hidden">

        <div class="relative">
            <img class="w-full h-48 object-cover"
                 src="{{ url_for('static', filename='img/alumno.jpg') }}"
                 alt="Imagen Alumno">

            <!-- Botón X -->
            <a href="{{ url_for('maestros.maestros_index') }}"
               class="absolute top-3 right-3 bg-white rounded-full w-8 h-8 flex items-center justify-center shadow-md hover:bg-gray-100 transition">
                ✕
            </a>
        </div>

        <!-- Contenido -->
        <div class="p-6 text-center">

            <span class="inline-block bg-blue-100 text-blue-700 text-xs font-semibold px-3 py-1 rounded-full mb-3">
                Credencial 
            </span>

            <h5 class="mt-2 mb-4 text-2xl font-bold text-gray-800 uppercase">
                {{ maestro.nombre }} {{ maestro.apellidos }}
            </h5>

            <div class="text-left bg-gray-50 p-4 rounded-xl border border-gray-100 space-y-3">

                <div>
                    <span class="block text-xs text-gray-400 uppercase font-bold">Correo</span>
                    <span class="text-sm text-gray-700 truncate block">
                        {{ maestro.especialidad }} {{ maestro.email }}
                    </span>
                </div>

            </div>

            <div class="mt-6">
                <a href="{{ url_for('maestros.maestros_index') }}"
                   class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-sm transition transform hover:scale-105">
                    Volver al listado
                </a>
            </div>

        </div>
    </div>

</div>
{% endblock %}
