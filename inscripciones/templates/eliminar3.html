{% extends "layout.html" %}
{% block container %}

<form method="POST" class="max-w-md mx-auto">
    
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

    {# ID de la inscripción para que la ruta sepa cuál borrar #}
    <input type="hidden" name="id" value="{{ inscripcion.id }}">

    <div class="mb-5">
        <label class="block mb-2 text-sm font-medium text-heading">
            Alumno
        </label>
        <input type="text" value="{{ inscripcion.alumno.nombre }} {{ inscripcion.alumno.apellidos }}" readonly
        class="bg-neutral-secondary-soft border border-default-medium text-body text-sm rounded-base block w-full px-3 py-2.5 shadow-xs cursor-not-allowed"/>
    </div>

    <div class="mb-5">
        <label class="block mb-2 text-sm font-medium text-heading">
            Curso
        </label>
        <input type="text" value="{{ inscripcion.curso.nombre }}" readonly
        class="bg-neutral-secondary-soft border border-default-medium text-body text-sm rounded-base block w-full px-3 py-2.5 shadow-xs cursor-not-allowed"/>
    </div>

    <div class="p-4 mb-6 text-sm text-red-800 rounded-base bg-red-50 border border-red-200 text-center italic">
        ¿Estás seguro de que deseas eliminar esta inscripción permanentemente?
    </div>

    <div class="flex flex-col gap-3 mt-4">

        <a href="{{ url_for('inscripciones.lista') }}"
        class="text-center text-body bg-neutral-secondary-soft border border-default-medium hover:bg-neutral-tertiary focus:ring-4 focus:ring-neutral-200 font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none w-full transition-colors">
            Cancelar y Volver
        </a>

    </div>


</form>

{% endblock %}
