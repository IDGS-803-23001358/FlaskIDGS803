{% extends "layout.html" %}
{% block container %}


<form action="" method="POST" novalidate class="max-w-md mx-auto">
    
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
    
    {# ID de la inscripción para que la ruta sepa cuál actualizar #}
    <input type="hidden" name="id" value="{{ inscripcion.id }}">

    <div class="mb-5">
        <label class="block mb-2 text-sm font-medium text-heading">
            Seleccionar Alumno
        </label>

        <select name="alumno"
        class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs">

        {% for a in alumnos %}
            <option value="{{ a.id }}" {% if a.id == inscripcion.alumno_id %} selected {% endif %}>
                {{ a.nombre }} {{ a.apellidos }}
            </option>
        {% endfor %}

        </select>
    </div>

    <div class="mb-5">
        <label class="block mb-2 text-sm font-medium text-heading">
            Seleccionar Curso
        </label>

        <select name="curso"
        class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs">

        {% for c in cursos %}
            <option value="{{ c.id }}" {% if c.id == inscripcion.curso_id %} selected {% endif %}>
                {{ c.nombre }}
            </option>
        {% endfor %}

        </select>
    </div>

    <div class="flex flex-col gap-3 mt-8">

        <button type="submit"
        class="text-white bg-brand box-border border border-transparent hover:bg-brand-strong focus:ring-4 focus:ring-brand-medium shadow-xs font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none w-full">
            Actualizar Inscripción
        </button>

        <a href="{{ url_for('inscripciones.lista') }}"
        class="text-center text-body bg-neutral-secondary-soft border border-default-medium hover:bg-neutral-tertiary focus:ring-4 focus:ring-neutral-200 font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none w-full">
            Cancelar
        </a>

    </div>

</form>

{% endblock %}
