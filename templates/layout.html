<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flowbite Flask</title>
    <link rel="stylesheet" href="{{url_for('static',filename='dist/output.css')}}">
</head>
<body>
    <nav class="bg-white border-gray-200 px-2 sm:px-4 py-2.5 rounded-sm dark:bg-gray-900 border-b">
        <div class="container flex flex-wrap items-center justify-between mx-auto">
            <a href="{{ url_for('alumnos.index') }}" class="flex items-center">
                <img src="{{url_for('static',filename='img/IDGS805.png')}}" class=" rounded-2xl h-6 mr-3 sm:h-9" alt="Flowbite Logo">
                <span class="self-center text-xl font-semibold whitespace-nowrap dark:text-white">Flask IDGS</span>
            </a>
            <div class="flex md:order-2">
                <button type="button"
                    class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center mr-3 md:mr-0 dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">
                    Get started
                </button>
                <button data-collapse-toggle="navbar-cta" type="button"
                    class="inline-flex items-center p-2 text-sm text-gray-500 rounded-lg md:hidden hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200 dark:text-gray-400 dark:hover:bg-gray-700 dark:focus:ring-gray-600"
                    aria-controls="navbar-cta" aria-expanded="false">
                    <span class="sr-only">Open main menu</span>
                    <svg class="w-6 h-6" aria-hidden="true" fill="currentColor" viewBox="0 0 20 20"
                        xmlns="http://www.w3.org/2000/svg">
                        <path fill-rule="evenodd"
                            d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z"
                            clip-rule="evenodd"></path>
                    </svg>
                </button>
            </div>
            <div class="items-center justify-between hidden w-full md:flex md:w-auto md:order-1" id="navbar-cta">
                <ul class="flex flex-col p-4 mt-4 border border-gray-100 rounded-lg bg-gray-50 md:flex-row md:space-x-8 md:mt-0 md:text-sm md:font-medium md:border-0 md:bg-white dark:bg-gray-800 md:dark:bg-gray-900 dark:border-gray-700">
                    <li>
                        <a href="{{ url_for('alumnos.index') }}"
                            class="block py-2 pl-3 pr-4 {% if request.endpoint == 'alumnos.index' %}text-blue-700{% else %}text-gray-700{% endif %} rounded hover:bg-gray-100 md:hover:bg-transparent md:hover:text-blue-700 md:p-0">
                            Alumnos
                        </a>
                    </li>
                    <li>
                        <a href="{{ url_for('maestros.maestros_index') }}"
                            class="block py-2 pl-3 pr-4 {% if request.endpoint == 'maestros.maestros_index' %}text-blue-700{% else %}text-gray-700{% endif %} rounded hover:bg-gray-100 md:hover:bg-transparent md:hover:text-blue-700 md:p-0">
                            Maestros
                        </a>
                    </li>
                    <li>
                        <a href="{{ url_for('cursos.cursos_index') }}"
                            class="block py-2 pl-3 pr-4 {% if request.endpoint == 'cursos.cursos_index' %}text-blue-700{% else %}text-gray-700{% endif %} rounded hover:bg-gray-100 md:hover:bg-transparent md:hover:text-blue-700 md:p-0">
                            Cursos
                        </a>
                    </li>
                    <li>
                        <a href="{{ url_for('inscripciones.lista') }}"
                            class="block py-2 pl-3 pr-4 {% if request.endpoint == 'inscripciones.lista' %}text-blue-700{% else %}text-gray-700{% endif %} rounded hover:bg-gray-100 md:hover:bg-transparent md:hover:text-blue-700 md:p-0">
                            Inscripciones
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
   
    <div class="container mx-auto mt-6 px-4">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="p-4 mb-4 text-sm text-green-800 rounded-lg bg-green-50 dark:bg-gray-800 dark:text-green-400 border border-green-200" role="alert">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
       
        {% block container %}
        {% endblock %}
    </div>

    <div class="fixed z-50 w-full h-16 max-w-lg -translate-x-1/2 bg-white border border-gray-200 rounded-full bottom-4 left-1/2 dark:bg-gray-700 dark:border-gray-600 shadow-lg">
        <div class="grid h-full max-w-lg grid-cols-4 mx-auto">
            <a href="{{ url_for('alumnos.index') }}" class="inline-flex flex-col items-center justify-center px-5 rounded-s-full hover:bg-gray-50 group">
                <svg class="w-5 h-5 mb-1 text-gray-500 group-hover:text-blue-600" fill="currentColor" viewBox="0 0 20 20"><path d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z"></path></svg>
                <span class="text-xs text-gray-500 group-hover:text-blue-600">Alumnos</span>
            </a>
            <a href="{{ url_for('maestros.maestros_index') }}" class="inline-flex flex-col items-center justify-center px-5 hover:bg-gray-50 group">
                <svg class="w-5 h-5 mb-1 text-gray-500 group-hover:text-blue-600" fill="currentColor" viewBox="0 0 20 20"><path d="M10.394 2.08a1 1 0 00-.788 0l-7 3a1 1 0 000 1.84L5.25 8.051a.999.999 0 01.356-.257l4-1.714a1 1 0 11.788 1.838L7.667 9.088l1.94.831a1 1 0 00.787 0l7-3a1 1 0 000-1.838l-7-3zM3.31 9.397L5 10.12v4.102a8.969 8.969 0 00-1.05-.174 1 1 0 01-.89-.89 11.115 11.115 0 01.25-3.762zM9.3 16.573A9.026 9.026 0 007 14.935v-3.957l1.818.78a3 3 0 002.364 0l5.508-2.361a11.026 11.026 0 01.25 3.762 1 1 0 01-.89.89 8.968 8.968 0 00-5.35 2.524 1 1 0 01-1.4 0z"></path></svg>
                <span class="text-xs text-gray-500 group-hover:text-blue-600">Maestros</span>
            </a>
            <a href="{{ url_for('cursos.cursos_index') }}" class="inline-flex flex-col items-center justify-center px-5 hover:bg-gray-50 group">
                <svg class="w-5 h-5 mb-1 text-gray-500 group-hover:text-blue-600" fill="currentColor" viewBox="0 0 20 20"><path d="M9 4.804A7.99 7.99 0 012.144 2A9.236 9.236 0 001 3.837c0 5.073 4.108 9.182 9.182 9.182h.818a3.182 3.182 0 003.182-3.182V9a9 9 0 00-9-9 1 1 0 00-1 1v1.804z"></path></svg>
                <span class="text-xs text-gray-500 group-hover:text-blue-600">Cursos</span>
            </a>
            <a href="{{ url_for('inscripciones.lista') }}" class="inline-flex flex-col items-center justify-center px-5 rounded-e-full hover:bg-gray-50 group">
                <svg class="w-5 h-5 mb-1 text-gray-500 group-hover:text-blue-600" fill="currentColor" viewBox="0 0 20 20"><path d="M7 3a1 1 0 000 2h6a1 1 0 100-2H7zM4 7a1 1 0 011-1h10a1 1 0 110 2H5a1 1 0 01-1-1zM2 11a2 2 0 012-2h12a2 2 0 012 2v4a2 2 0 01-2 2H4a2 2 0 01-2-2v-4z"></path></svg>
                <span class="text-xs text-gray-500 group-hover:text-blue-600">Inscrip.</span>
            </a>
        </div>
    </div>
 
    <script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.js"></script>
</body>
</html>
